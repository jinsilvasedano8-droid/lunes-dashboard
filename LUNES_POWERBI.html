function detail(id){
 const r=byId(id),o=obs(id,2025),fact=(label,val)=>`<div class="factbox"><small>${label}</small>${val}</div>`;
 openModal('Detalle del riesgo · '+id,`<h2>${esc(r.Riesgo)}</h2><p>${chip(r.Nivel_Clasificacion,colors[r.Nivel_Clasificacion])} · Nivel ${score(r)}/9 · Registrado en ${r.Año_Registro}</p><div class="details">${fact('Causa · REAL',esc(r.Causa))+fact('Control · REAL',esc(r.Control))+fact('Responsable',esc(r.Responsable))+fact('Tipo / tratamiento',r.Tipo_Control+' · '+r.Tratamiento)+fact('Activo / aspecto estratégico',esc(r.Activo))+fact('Fecha del control',r.Fecha_Control.slice(0,10).split('-').reverse().join('/'))}</div><div class="grid equal spacer">${panel('Evolución real',line(years,[{name:'Cumplimiento anual',values:years.map(y=>obs(id,y).Cumpl_Pct),max:1,fmt:v=>pct(v,0),color:C.g}]),'')}${panel('Estado en 2025',gauge(o.Cumpl_Pct,o.Estado,'Seguimiento · 2025'),'')}</div><p class="note">${esc(o.Observacion)}</p><button class="tool" data-solution="${id}">Ver solución en Controles</button>`)
}
const attachments=JSON.parse($('assets').textContent);
function documentation(){
 openModal('Fuentes y método',`<h2>Cómo leer y defender el informe</h2><p>El inventario describe 15 riesgos del Sistema de Cobertura de Vacunación Regular – Adulto en Huancayo, Tarma, Jauja, Satipo y Chanchamayo. Cada riesgo tiene una evaluación y tres cortes de seguimiento.</p><div class="details"><div class="factbox"><small>REAL · DATOS.xlsx</small>Inventario, causas, responsables, fechas, estados y totales anuales de incidentes. Tipo de control según la sección 4.1 del proyecto.</div><div class="factbox"><small>[SIMULADO] · NumPy, semilla 42</small>Costos, eficacia, horas y atribución de incidentes. La severidad deriva del riesgo elegido entre los ya registrados ese año.</div></div><h3>Qué cambia al elegir 2025</h3><p>El seguimiento muestra 10 controles ejecutados y 5 en proceso. El total de incidentes baja a 1. El inventario conserva sus 15 riesgos. En Evaluación, «Año de registro» permite aislar las dos altas de 2025. Nivel y riesgo se comparten entre Evaluación y Controles.</p>${table(['Indicador','Fuente y cálculo'],[['Total y críticos','Dim_Riesgo · claves únicas y nivel 9'],['Nivel / año crítico','Fact_Evaluacion · promedio de probabilidad × impacto; cohorte de registro con la mayor media'],['Madurez y avance','Fact_Seguimiento · media de Cumpl_Pct por riesgo-año'],['Riesgos acumulados','Fact_Evaluacion · altas hasta el año del eje'],['Pérdida / inversión','Fact_Evaluacion · suma de los importes simulados'],['Evitado / ROI','Suma de pérdida × eficacia; beneficio neto dividido por inversión'],['Mitigación / objetivo','Evitado ÷ pérdida; nivel × (1 − eficacia)'],['Incidentes / reducción','Fact_Incidentes · conteos reales por año; diferencia respecto a 2023 dividida por la base de 2023'],['MTTR','Fact_Incidentes · promedio de Horas_Resolucion [SIMULADO]']])}<h3>Material del proyecto</h3><p>Archivos incluidos en este HTML. Puedes guardarlos para reproducir el modelo o preparar la exposición.</p><div class="doc">${Object.keys(attachments).map(k=>`<button class="tool" data-download="${esc(k)}">${esc(k)}</button>`).join(' ')}</div>`)
}
function terrain(){
 // Curvas de nivel decorativas, sin atribución geográfica ni escala cuantitativa.
 const paths=[],step=6,w=660,h=156,field=(x,y)=>Math.sin(x/114+.66*Math.sin(y/52))+.56*Math.cos(y/53+x/97)+.43*Math.sin(x/59-y/60)+.22*Math.cos(x/35+y/66);
 for(let level=-2;level<=2.15;level+=.095){
 let d='';for(let y=-6;y<h;y+=step)for(let x=-6;x<w;x+=step){const p=[[x,y],[x+step,y],[x+step,y+step],[x,y+step]],z=p.map(a=>field(...a)),e=[];
 for(let i=0;i<4;i++){let j=(i+1)%4;if((z[i]<level)!==(z[j]<level)){let f=(level-z[i])/(z[j]-z[i]);e.push([p[i][0]+f*(p[j][0]-p[i][0]),p[i][1]+f*(p[j][1]-p[i][1])])}}
 for(let i=1;i<e.length;i+=2)d+='M'+e[i-1].map(v=>v.toFixed(1)).join(' ')+'L'+e[i].map(v=>v.toFixed(1)).join(' ');
 }paths.push(`<path d="${d}" fill="none" stroke="${level>.6?C.a:'#5B6B8C'}" opacity="${level>.6?.60:.40}" stroke-width=".9"/>`)}
 return paths.join('')
}
function render(){
 const p=S.page;$('ey').textContent=['SEGURIDAD DE LA INFORMACIÓN','INVENTARIO Y EVALUACIÓN','TRATAMIENTO DE RIESGOS','ECONOMÍA DEL CONTROL','SEGUIMIENTO OPERATIVO','DECISIÓN PRESUPUESTARIA'][p];
 $('title').textContent=labels[p];$('subtitle').textContent=subs[p];$('nav').innerHTML=names.map((n,i)=>`<button data-page="${i}" class="${i===p?'on':''}" ${i===p?'aria-current="page"':''}>${ic(icons[i])}${n}</button>`).join('');
 $('period').innerHTML=`<div class="row"><span class="label">Año de seguimiento</span>${p===0?`<div class="seg">${[0,...years].map(y=>`<button data-year="${y}" class="${S.year===y?'on':''}" aria-pressed="${S.year===y}">${y||'Todos'}</button>`).join('')}</div>`:`<button class="tool" data-page="0" title="Cambiar en Resumen">${S.year||'2023–2025'}</button>`}</div><span class="ey" style="color:var(--muted)">ISO 27001:2022</span>`;
 $('content').innerHTML=[overview,evaluation,controls,finance,incidentPage,optimization][p]();$('tip').hidden=true;
}
function go(page){S.page=Number(page);render();window.scrollTo(0,0)}
function reset(){Object.assign(S,{year:0,reg:0,level:'',risk:'',fin:'',sev:'',incyear:0,opt:'',foda:'',plan:'P1'})}
document.addEventListener('click',async e=>{
 const el=e.target.closest('button,[data-pick],[data-opt],[data-sev]');if(!el)return;const d=el.dataset;
 if('page'in d)go(d.page);
 else if('year'in d){S.year=Number(d.year);S.incyear=0;S.sev='';render()}
 else if('resetall'in d){reset();go(0)}
 else if('clear'in d){S.risk=S.level=S.sev='';S.reg=S.year=S.incyear=0;render()}
 else if(d.detail)detail(d.detail);
 else if(d.solution){$('modal').close();S.risk=d.solution;S.level='';go(2)}
 else if(d.pick){S.risk=S.risk===d.pick?'':d.pick;render()}
 else if(d.fin){S.fin=S.fin===d.fin?'':d.fin;render()}
 else if(d.opt){S.opt=S.opt===d.opt?'':d.opt;render()}
 else if(d.sev){const same=d.sev===S.sev&&Number(d.incyear)===S.incyear;S.sev=same?'':d.sev;S.incyear=same?0:Number(d.incyear);render()}
 else if('unsev'in d){S.sev='';S.incyear=0;render()}
 else if(d.foda){S.foda=S.foda===d.foda?'':d.foda;S.opt='';render()}
 else if('doc'in d)documentation();
 else if(d.download){let a=document.createElement('a');a.href='data:application/octet-stream;base64,'+attachments[d.download];a.download=d.download;a.click()}
 else if(el.id==='close')$('modal').close();
 
  else if(el.id==='themeToggle'){
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'powerbi-light' ? 'powerbi-dark' : 'powerbi-light';
    document.documentElement.setAttribute('data-theme', next);
    el.textContent = next === 'powerbi-light' ? '🌙 Modo Oscuro' : '🎨 Tema Claro';
    try{localStorage.setItem('pbi-theme', next)}catch(err){}
  }
  else if(el.id==='copyShare'){
    navigator.clipboard.writeText(window.location.href).catch(()=>{});
    const t = document.getElementById('toast');
    if(t){
      t.classList.remove('hide');
      setTimeout(()=>t.classList.add('hide'), 2500);
    }
  }
  else if(el.id==='full'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('full').title='Usa F11 para pantalla completa'}}
});
document.addEventListener('change',e=>{const k=e.target.dataset.field;if(!k)return;S[k]=k==='reg'?Number(e.target.value):e.target.value;if(k==='reg'||k==='level')S.risk='';render()});
function showTip(el,x,y){const t=$('tip');t.innerHTML=tooltip(byId(el.dataset.bubble));t.hidden=false;t.style.left=Math.max(2,Math.min(x+12,innerWidth-t.offsetWidth-6))+'px';t.style.top=Math.max(3,Math.min(y+12,innerHeight-t.offsetHeight-6))+'px'}
document.addEventListener('pointermove',e=>{const b=e.target.closest('[data-bubble]');if(b)showTip(b,e.clientX,e.clientY);else $('tip').hidden=true});
document.addEventListener('focusin',e=>{const b=e.target.closest('[data-bubble]');if(b){const r=b.getBoundingClientRect();showTip(b,r.right,r.top)}else $('tip').hidden=true});
document.addEventListener('keydown',e=>{const el=e.target.closest('svg [role=button]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.key==='Escape')$('tip').hidden=true});
document.addEventListener('contextmenu',e=>{const b=e.target.closest('[data-bubble],[data-detail]');if(b){e.preventDefault();detail(b.dataset.bubble||b.dataset.detail)}});
$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}});

try{
  const saved = localStorage.getItem('pbi-theme');
  if(saved){
    document.documentElement.setAttribute('data-theme', saved);
    const btn = document.getElementById('themeToggle');
    if(btn) btn.textContent = saved === 'powerbi-light' ? '🌙 Modo Oscuro' : '🎨 Tema Claro';
  }
}catch(e){}
$('terrain').innerHTML=terrain();render();

</script><div id="toast" class="toast hide">¡Enlace copiado al portapapeles!</div></body></html>
